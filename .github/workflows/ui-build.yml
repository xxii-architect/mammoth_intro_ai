name: UI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/mad-architecht-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/mad-architecht-command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build tokens and UI
        run: npm run build

      - name: Check workspace SDK public types
        run: npx --no-install tsc -p ../../packages/mammoth-paths/typecheck/tsconfig.json

  ui-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/mad-architecht-command-center/package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install locked UI dependencies
        working-directory: ui/mad-architecht-command-center
        run: npm ci

      - name: Install Chromium and Linux browser dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Test fail-closed browser reporter
        run: node --test tests/workspace-browser-reporter.test.cjs

      - name: Verify workspace browser interactions
        env:
          MAMMOTH_BROWSER_REPORT_DIR: ${{ runner.temp }}/workspace-browser
        run: npx --no-install playwright test --config tests/workspace-ci.playwright.config.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-evidence
          path: ${{ runner.temp }}/workspace-browser
          if-no-files-found: warn
          retention-days: 7
