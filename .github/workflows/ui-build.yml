name: UI Build

on:
  push:
    branches: [main]
    paths:
      - 'ui/mad-architecht-command-center/**'
      - 'packages/mammoth-paths/**'
      - '.github/workflows/ui-build.yml'
  pull_request:
    paths:
      - 'ui/mad-architecht-command-center/**'
      - 'packages/mammoth-paths/**'
      - '.github/workflows/ui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/mad-architecht-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/mad-architecht-command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build tokens and UI
        run: npm run build
