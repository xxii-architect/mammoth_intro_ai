name: CI

on:
  push:
    branches: [ main, 'agents/*', 'merge-preview*' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    env:
      MAMMOTH_REQUIRE_PACKAGED_SDK_TESTS: '1'
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node for installed SDK contract tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy setuptools wheel
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Legacy lint diagnostics (not a release gate)
        env:
          PYTHONPATH: src
        run: |
          ruff check src || true
        shell: bash

      - name: Legacy type diagnostics (not a release gate)
        env:
          PYTHONPATH: src
        run: |
          mypy src || true
        shell: bash

      - name: Run tests (Linux with coverage)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest --junitxml=pytest.xml --cov=src --cov-report=xml -q | tee test.log

      - name: Run tests (Windows with coverage)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: |
          python -m pytest --junitxml=pytest.xml --cov=src --cov-report=xml -q | Tee-Object -FilePath test.log
        shell: pwsh

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            pytest.xml
            test.log
            coverage.xml

  paths-sdk-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pinned quality tools
        run: python -m pip install -r scripts/quality/requirements.txt pytest

      - name: Enforce Paths correctness lint
        run: python -m ruff check --config scripts/quality/paths-ruff.toml src/mammoth_os/paths

      - name: Enforce Paths bounded strict typing
        run: python -m mypy --config-file scripts/quality/paths-mypy.ini

      - name: Verify gates reject regressions
        env:
          MAMMOTH_REQUIRE_QUALITY_TESTS: '1'
        run: python -m pytest tests/test_paths_quality_gate.py --noconftest -q

  paths-sdk-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test @mammothos/paths
        working-directory: packages/mammoth-paths
        run: npm test

  sandbox-diagnostics:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
        shell: bash

      - name: Classify Docker-only smoke evidence (not owner isolation acceptance)
        env:
          PYTHONPATH: src
        run: python .github/scripts/run_sandbox_test.py --diagnostic
        shell: bash
      - name: Upload runtime info artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-runtime-info
          path: |
            runtime_info.txt
            runtime_error.txt
            runtime_evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Run CI seccomp tuner
        if: always()
        run: |
          python .github/scripts/ci_seccomp_tuner.py --runtime runtime_info.txt --stderr runtime_error.txt --out diagnostics
        shell: bash

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seccomp-diagnostics
          path: diagnostics
          retention-days: 7
