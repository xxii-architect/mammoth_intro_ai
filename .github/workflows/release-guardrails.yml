name: Release Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest

      - name: Enforce release/eval/tutor/SDK gates
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_atlas_evals.py \
            tests/test_production_guardrails.py \
            tests/test_atlas_fab_sdk.py \
            src/mammoth_os/test_learner_model.py \
            tests/test_runtime_resilience.py \
            tests/test_runtime_state_usage.py \
            tests/test_shared_state_admission.py \
            tests/test_hosted_storage_preflight.py \
            tests/test_server_routes_layout.py \
            -q

  shared-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      MAMMOTH_TEST_POSTGRES_CONTAINER: mammoth-admission-ci
      MAMMOTH_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Start dedicated ephemeral PostgreSQL
        run: |
          docker run --name mammoth-admission-ci -p 127.0.0.1::5432 -e POSTGRES_PASSWORD=fixture-only -d postgres:16
          for attempt in $(seq 1 30); do
            if docker exec mammoth-admission-ci pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m pytest tests/test_shared_state_admission.py tests/test_postgres_run_store.py tests/test_postgres_documents.py -q
      - name: Stop dedicated fixture database
        if: always()
        run: docker rm -f mammoth-admission-ci
