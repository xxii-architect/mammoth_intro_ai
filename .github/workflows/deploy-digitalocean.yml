name: Deploy to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required secrets
        id: validate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          DO_DEPLOY_COMMAND: ${{ secrets.DO_DEPLOY_COMMAND }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DO_SSH_PRIVATE_KEY:-}" ] && [ -z "${DO_SSH_PRIVATE_KEY_B64:-}" ]; then
            missing=1
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::Missing required secret: DO_SSH_PRIVATE_KEY (or DO_SSH_PRIVATE_KEY_B64)"
            fi
          fi
          for var in DO_HOST DO_USER DO_APP_PATH DO_DEPLOY_COMMAND; do
            if [ -z "${!var:-}" ]; then
              missing=1
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "::error::Missing required secret: ${var}"
              fi
            fi
          done
          if [ "$missing" -ne 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not configured; skipping push-triggered deploy."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Start ssh-agent and add private key
        if: steps.validate.outputs.skip != 'true'
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${DO_SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "$DO_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$DO_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Configure known_hosts
        if: steps.validate.outputs.skip != 'true'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${DO_KNOWN_HOSTS:-}" ]; then
            echo "$DO_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on droplet
        if: steps.validate.outputs.skip != 'true'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PORT: ${{ secrets.DO_PORT }}
          DO_BRANCH: ${{ secrets.DO_BRANCH }}
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          DO_DEPLOY_COMMAND: ${{ secrets.DO_DEPLOY_COMMAND }}
        run: |
          set -euo pipefail
          PORT="${DO_PORT:-22}"
          BRANCH="${DO_BRANCH:-main}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$PORT" "${DO_USER}@${DO_HOST}" "bash -s -- \"$DO_APP_PATH\" \"$BRANCH\" \"$DO_DEPLOY_COMMAND\"" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$1"
          BRANCH="$2"
          DEPLOY_COMMAND="$3"

          cd "$APP_PATH"
          git fetch origin
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          bash -lc "$DEPLOY_COMMAND"
          REMOTE
