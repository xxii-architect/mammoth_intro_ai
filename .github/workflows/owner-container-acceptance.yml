name: Owner Container Acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Runner diagnostics or actual deployed production service
        type: choice
        default: runner
        options: [runner, production, storage-preflight]
      image:
        description: Reviewed image@sha256 digest, or configured for production live-process image only
        required: true
        type: string
      pull_reviewed_image:
        description: Explicitly pull this reviewed digest before the no-pull executor probe
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  owner-container-acceptance:
    if: inputs.target == 'runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      REVIEWED_IMAGE: ${{ inputs.image }}
      PULL_REVIEWED_IMAGE: ${{ inputs.pull_reviewed_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install host-side acceptance dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate operator image and optionally pull exactly that digest
        shell: bash
        run: |
          python -c "import os; from mammoth_os.owner_execution import IMAGE_RE; assert IMAGE_RE.fullmatch(os.environ['REVIEWED_IMAGE']), 'A reviewed image digest is required'"
          if [ "$PULL_REVIEWED_IMAGE" = "true" ]; then
            docker pull -- "$REVIEWED_IMAGE"
          fi
      - name: Strict trusted owner-runtime acceptance (no host fallback)
        run: python scripts/quality/check_owner_container.py --image "$REVIEWED_IMAGE" --output-dir owner-container-evidence
      - name: Upload bounded acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-container-evidence
          path: owner-container-evidence/owner_container_evidence.json
          if-no-files-found: warn
          retention-days: 7

  hosted-owner-container-acceptance:
    if: inputs.target == 'production' || inputs.target == 'storage-preflight'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: hosted-owner-container-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned SSH acceptance only (no deployment or image pulls)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PORT: ${{ secrets.DO_PORT }}
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_PRIVATE_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
          REVIEWED_IMAGE: ${{ inputs.image }}
          PULL_REVIEWED_IMAGE: ${{ inputs.pull_reviewed_image }}
          ACCEPTANCE_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          for var in DO_HOST DO_USER DO_APP_PATH DO_KNOWN_HOSTS; do
            test -n "${!var}" || { echo "::error::Missing pinned production SSH configuration: $var"; exit 1; }
          done
          test "$PULL_REVIEWED_IMAGE" != true || { echo "::error::Production acceptance never pulls images"; exit 1; }
          [[ "$DO_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$REVIEWED_IMAGE" == configured || "$REVIEWED_IMAGE" =~ ^[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/hosted-ssh" hosted-container-evidence
          chmod 700 "$RUNNER_TEMP/hosted-ssh"
          if [ -n "$DO_SSH_PRIVATE_KEY_B64" ]; then
            printf '%s' "$DO_SSH_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/hosted-ssh/key"
          else
            test -n "$DO_SSH_PRIVATE_KEY"
            printf '%s\n' "$DO_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/hosted-ssh/key"
          fi
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$RUNNER_TEMP/hosted-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/hosted-ssh/key"
          if [ "$ACCEPTANCE_TARGET" = storage-preflight ]; then
            ssh -i "$RUNNER_TEMP/hosted-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hosted-ssh/known_hosts" \
              -p "${DO_PORT:-22}" "${DO_USER}@${DO_HOST}" \
              "python3 - '$DO_APP_PATH'" < scripts/quality/inspect_hosted_storage.py \
              > hosted-container-evidence/storage_preflight.json
            exit 0
          fi
          PROBE_B64="$(base64 -w0 scripts/quality/check_owner_container.py)"
          ssh -i "$RUNNER_TEMP/hosted-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hosted-ssh/known_hosts" \
            -p "${DO_PORT:-22}" "${DO_USER}@${DO_HOST}" \
            "python3 - '$DO_APP_PATH' '$REVIEWED_IMAGE' '$GITHUB_SHA' '$PROBE_B64'" \
            < scripts/quality/check_hosted_owner_container.py \
            > hosted-container-evidence/hosted_container_evidence.json
      - name: Upload actual-host acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target == 'storage-preflight' && 'storage-preflight' || 'hosted-container-evidence' }}
          path: hosted-container-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove per-job SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/hosted-ssh/key" "$RUNNER_TEMP/hosted-ssh/known_hosts"
