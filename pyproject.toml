[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mammoth-os"
version = "0.5.0"
description = "MammothOS and ATLAS: a multi-agent tutoring, planning, and execution runtime."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agents", "atlas", "education", "tutoring", "developer-tools", "copilot", "workflow"]
authors = [
  { name = "Vernon" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Framework :: FastAPI",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi",
  "openai",
  "pydantic",
  "python-dotenv",
  "requests",
  "supabase",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]
local = ["openai"]
server = ["fastapi", "uvicorn"]

[project.urls]
Homepage = "https://github.com/xxii-architect/mammoth_intro_ai"
Repository = "https://github.com/xxii-architect/mammoth_intro_ai"
Issues = "https://github.com/xxii-architect/mammoth_intro_ai/issues"

[project.scripts]
mammoth = "cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
